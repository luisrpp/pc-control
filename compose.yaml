services:
  pc-control:
    build:
      context: .
      dockerfile: Dockerfile
    image: pc-control:0.1
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./secrets/private_key:/run/pc-control/ssh/private_key:ro
      - ./secrets/known_hosts:/run/pc-control/ssh/known_hosts:ro
